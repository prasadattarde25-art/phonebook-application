services:

  db:
    image: postgres:16
    container_name: phonebook-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  backend:
    build: ./backend

    container_name: phonebook-backend

    environment:
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "8000:8000"

    depends_on:
      - db


  frontend:
    build: ./frontend

    container_name: phonebook-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend


volumes:
  postgres_data: